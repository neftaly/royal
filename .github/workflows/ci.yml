name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Add Chromium command
        shell: bash
        run: |
          chrome_path='${{ steps.setup-chrome.outputs.chrome-path }}'
          if [ -z "$chrome_path" ] || [ ! -x "$chrome_path" ]; then
            echo "::error::setup-chrome did not provide an executable Chrome path."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          {
            echo '#!/usr/bin/env bash'
            printf 'exec %q "$@"\n' "$chrome_path"
          } > "$RUNNER_TEMP/bin/chromium"
          chmod +x "$RUNNER_TEMP/bin/chromium"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Examples browser smoke
        run: |
          if ! command -v chromium >/dev/null 2>&1; then
            echo "::error::Chromium is not available after setup-chrome."
            exit 1
          fi
          chromium --version
          pnpm --filter @royal/examples-react test:browser

      - name: Browser context loss and restoration
        env:
          EXAMPLES_SMOKE_CONTEXT_LOSS: "1"
          EXAMPLES_SMOKE_ROUTE: cube
        run: node apps/examples-react/scripts/browser-smoke.mjs

      - name: Build examples for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_PATH: /royal/
        run: pnpm --filter @royal/examples-react build

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp apps/examples-react/dist/index.html apps/examples-react/dist/404.html
          touch apps/examples-react/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/examples-react/dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
