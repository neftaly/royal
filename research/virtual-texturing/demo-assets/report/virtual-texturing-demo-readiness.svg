    .value { fill: #11191f; font-size: 30px; font-weight: 800; }
    .panel { fill: #f7f4ed; stroke: #cfc4ac; stroke-width: 1; rx: 8; }
    .ink { fill: #172026; }
    .muted { fill: #6c7a82; }
    .pass { fill: #2d7d4f; }
    .warn { fill: #a35f00; }
    .info { fill: #315f8d; }
