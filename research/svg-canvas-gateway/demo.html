<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SVG Canvas Gateway Star Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f1e8;
        color: #25231f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        min-height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100vh;
        background:
          linear-gradient(90deg, rgba(35, 39, 45, 0.08) 1px, transparent 1px),
          linear-gradient(0deg, rgba(35, 39, 45, 0.08) 1px, transparent 1px),
          #faf7ef;
        background-size: 32px 32px;
        touch-action: none;
        cursor: crosshair;
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-left: 1px solid #d5c8b6;
        padding: 20px;
        background: #fffaf1;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      dt {
        color: #695b48;
      }

      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      code {
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        canvas {
          height: 68vh;
        }

        aside {
          border-left: 0;
          border-top: 1px solid #d5c8b6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="stage" width="960" height="640"></canvas>
      <aside>
        <h1>SVG Canvas Gateway</h1>
        <dl>
          <dt>pointer</dt>
          <dd id="pointer">-</dd>
          <dt>hit</dt>
          <dd id="hit">-</dd>
          <dt>drag</dt>
          <dd id="drag">idle</dd>
          <dt>texture</dt>
          <dd><code>svg blob -> image -> canvas</code></dd>
          <dt>geometry</dt>
          <dd><code>polygon hit region</code></dd>
        </dl>
      </aside>
    </main>
    <script type="module">
      const svgText = `<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  role="img"
  aria-label="Five point star fixture"
>
  <defs>
    <linearGradient id="star-gold" x1="40" y1="20" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.42" stop-color="#f5b83f"/>
      <stop offset="1" stop-color="#bf5b2d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#2b1e12" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <polygon
    points="128,20 153.9,92.4 230.7,94.6 169.8,141.6 191.5,215.4 128,172 64.5,215.4 86.2,141.6 25.3,94.6 102.1,92.4"
    fill="url(#star-gold)"
    stroke="#5f321f"
    stroke-width="8"
    stroke-linejoin="round"
    filter="url(#soft-shadow)"
  />
  <polygon
    points="128,38 148.4,98 211.4,99.6 161.4,138.2 179.7,198.7 128,163.5 76.3,198.7 94.6,138.2 44.6,99.6 107.6,98"
    fill="none"
    stroke="#fff7c9"
    stroke-width="4"
    stroke-linejoin="round"
    opacity="0.62"
  />
</svg>`;

      const starPoints = [
        [128, 20],
        [153.9, 92.4],
        [230.7, 94.6],
        [169.8, 141.6],
        [191.5, 215.4],
        [128, 172],
        [64.5, 215.4],
        [86.2, 141.6],
        [25.3, 94.6],
        [102.1, 92.4],
      ].map(([x, y]) => ({ x, y }));

      const canvas = document.querySelector('#stage');
      const context = canvas.getContext('2d');
      const pointerLabel = document.querySelector('#pointer');
      const hitLabel = document.querySelector('#hit');
      const dragLabel = document.querySelector('#drag');
      const textureCanvas = document.createElement('canvas');
      const textureContext = textureCanvas.getContext('2d');
      textureCanvas.width = 256;
      textureCanvas.height = 256;

      let starImage;
      let origin = { x: 260, y: 190 };
      let pointer = { x: 0, y: 0 };
      let dragging = false;
      let grabOffset = { x: 0, y: 0 };

      const loadSvgThroughCanvas = async () => {
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        try {
          if ('createImageBitmap' in window) {
            starImage = await createImageBitmap(blob);
          } else {
            starImage = await new Promise((resolve, reject) => {
              const image = new Image();
              image.onload = () => resolve(image);
              image.onerror = reject;
              image.src = url;
            });
          }

          textureContext.clearRect(0, 0, textureCanvas.width, textureCanvas.height);
          textureContext.drawImage(starImage, 0, 0, 256, 256);
        } finally {
          URL.revokeObjectURL(url);
        }
      };

      const classifyPoint = (point, polygon) => {
        let inside = false;

        for (let index = 0, previousIndex = polygon.length - 1; index < polygon.length; previousIndex = index, index += 1) {
          const start = polygon[previousIndex];
          const end = polygon[index];

          if (pointOnSegment(point, start, end)) {
            return 'boundary';
          }

          if (start.y > point.y !== end.y > point.y) {
            const intersectionX =
              ((end.x - start.x) * (point.y - start.y)) / (end.y - start.y) + start.x;

            if (point.x < intersectionX) {
              inside = !inside;
            }
          }
        }

        return inside ? 'inside' : 'outside';
      };

      const pointOnSegment = (point, start, end, epsilon = 1e-8) => {
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const length = Math.hypot(dx, dy);
        const cross = (point.x - start.x) * dy - (point.y - start.y) * dx;
        const dot = (point.x - start.x) * dx + (point.y - start.y) * dy;

        return (
          Math.abs(cross) <= epsilon * Math.max(1, length) &&
          dot >= -epsilon &&
          dot <= length * length + epsilon
        );
      };

      const localPointer = () => ({ x: pointer.x - origin.x, y: pointer.y - origin.y });
      const pointerHitsStar = () => classifyPoint(localPointer(), starPoints) !== 'outside';

      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      };

      const draw = () => {
        const rect = canvas.getBoundingClientRect();
        context.clearRect(0, 0, rect.width, rect.height);

        context.save();
        context.translate(origin.x, origin.y);
        context.strokeStyle = 'rgba(160, 87, 43, 0.36)';
        context.setLineDash([8, 6]);
        context.strokeRect(0, 0, 256, 256);
        context.setLineDash([]);

        if (starImage !== undefined) {
          context.drawImage(textureCanvas, 0, 0, 256, 256);
        }

        context.beginPath();
        for (const [index, point] of starPoints.entries()) {
          if (index === 0) {
            context.moveTo(point.x, point.y);
          } else {
            context.lineTo(point.x, point.y);
          }
        }
        context.closePath();
        context.lineWidth = 3;
        context.strokeStyle = pointerHitsStar() ? '#1f7a54' : '#b84a3a';
        context.stroke();
        context.restore();

        context.beginPath();
        context.arc(pointer.x, pointer.y, 5, 0, Math.PI * 2);
        context.fillStyle = pointerHitsStar() ? '#1f7a54' : '#b84a3a';
        context.fill();

        pointerLabel.textContent = `${Math.round(pointer.x)}, ${Math.round(pointer.y)}`;
        hitLabel.textContent = pointerHitsStar() ? 'star geometry' : 'miss';
        dragLabel.textContent = dragging ? 'active' : 'idle';
      };

      const updatePointer = (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
        };
      };

      canvas.addEventListener('pointerdown', (event) => {
        updatePointer(event);

        if (!pointerHitsStar()) {
          draw();
          return;
        }

        dragging = true;
        grabOffset = localPointer();
        canvas.setPointerCapture(event.pointerId);
        draw();
      });

      canvas.addEventListener('pointermove', (event) => {
        updatePointer(event);

        if (dragging) {
          origin = {
            x: pointer.x - grabOffset.x,
            y: pointer.y - grabOffset.y,
          };
        }

        draw();
      });

      canvas.addEventListener('pointerup', (event) => {
        dragging = false;
        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
        draw();
      });

      canvas.addEventListener('pointercancel', () => {
        dragging = false;
        draw();
      });

      window.addEventListener('resize', resize);
      await loadSvgThroughCanvas();
      resize();
    </script>
  </body>
</html>
