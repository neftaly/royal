<!doctype html><meta charset="utf-8"><title>Royal full-source alternatives check</title>
<script type="module">
import { runSourceCombinations } from './source-combinations.ts';
window.runVTComparison = new URLSearchParams(location.search).has('rectangular-crops')
  ? async () => (await import('./rectangular-page-crops.ts')).runRectangularPageCrops()
  : new URLSearchParams(location.search).has('bitmap-resize')
  ? async () => (await import('./bitmap-resize.ts')).runBitmapResize()
  : new URLSearchParams(location.search).has('first-presentation')
  ? async () => (await import('./first-presentation.ts')).runFirstPresentation()
  : new URLSearchParams(location.search).has('large-contention')
  ? async () => (await import('./large-contention.ts')).runLargeContention()
  : runSourceCombinations;
</script>
