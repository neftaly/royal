<!doctype html><meta charset="utf-8"><title>Royal VT filtering and demand experiment</title>
<p>Run benchmarks on this device. Results identify the renderer; SwiftShader results are software measurements.</p>
<button id="run">Run</button><pre id="output"></pre>
<script type="module">
import { runDemandBenchmark } from './demand.ts';
import { runFilteringBenchmark } from './filtering.ts';
window.runVTComparison = async () => ({ demand: runDemandBenchmark(), filtering: await runFilteringBenchmark() });
document.querySelector('#run').onclick = async () => {
  document.querySelector('#output').textContent = JSON.stringify(await window.runVTComparison(), null, 2);
};
</script>
