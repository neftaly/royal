<!doctype html>
<meta charset="utf-8">
<title>Texture inspection browser tests</title>
<pre id="result">Running…</pre>
<script type="module">
  window.textureInspectionTest = import("./texture-inspection.ts")
    .then(module => module.runTextureInspectionBrowserTests());
  window.textureInspectionTest.then(
    passed => { document.getElementById("result").textContent = JSON.stringify(passed, null, 2); },
    error => { document.getElementById("result").textContent = String(error.stack ?? error); },
  );
</script>
