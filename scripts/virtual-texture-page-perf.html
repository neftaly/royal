<!doctype html>
<meta charset="utf-8">
<title>Royal generated VT page benchmark</title>
<body data-royal-vt-perf="pending">
<script type="module">
  import {
    createAutomaticRasterPageSource,
  } from "/packages/renderer-webgl/src/virtual-texture/automatic-page-source.ts";
  import {
    createGeneratedVirtualTextureManifest,
    virtualTexturePageKeyParts,
  } from "/packages/renderer-webgl/src/virtual-texture/manifest.ts";
  import {
    virtualTexturePageTableByteLength,
    writeVirtualTexturePageTable,
  } from "/packages/renderer-webgl/src/virtual-texture/residency.ts";

  const sourceCanvas = document.createElement("canvas");
  sourceCanvas.width = 4096;
  sourceCanvas.height = 4096;
  const sourceContext = sourceCanvas.getContext("2d");
  const gradient = sourceContext.createLinearGradient(0, 0, 4096, 4096);
  gradient.addColorStop(0, "#ef246b");
  gradient.addColorStop(0.5, "#31a8ff");
  gradient.addColorStop(1, "#f6dc45");
  sourceContext.fillStyle = gradient;
  sourceContext.fillRect(0, 0, 4096, 4096);

  const sampler = {
    magFilter: "linear",
    minFilter: "linear-mipmap-linear",
    wrapS: "repeat",
    wrapT: "repeat",
  };
  const source = createAutomaticRasterPageSource({
    close: () => undefined,
    height: 4096,
    source: sourceCanvas,
    width: 4096,
  }, sampler, "srgb");
  const manifest = source.manifest;
  const pageAt = (ordinal) => ({
    mip: 0,
    x: ordinal % 16,
    y: Math.floor(ordinal / 16) % 16,
  });
  const generateBatch = async (batchOrdinal) => {
    const pages = [];
    for (let page = 0; page < 4; page += 1) {
      pages.push(await source.read(
        pageAt(batchOrdinal * 4 + page),
        new AbortController().signal,
      ));
    }
    return pages;
  };

  for (let warmup = 0; warmup < 16; warmup += 1) {
    for (const page of await generateBatch(warmup)) page.close();
  }
  const samples = [];
  for (let batch = 0; batch < 128; batch += 1) {
    const started = performance.now();
    const pages = await generateBatch(batch);
    samples.push(performance.now() - started);
    if (pages.length !== 4) throw new Error("generated VT batch was incomplete");
    for (const page of pages) page.close();
  }
  samples.sort((left, right) => left - right);

  class CountedResidents extends Map {
    gets = 0;
    get(key) {
      this.gets += 1;
      return super.get(key);
    }
  }
  const pageTableManifest = createGeneratedVirtualTextureManifest({
    borderTexels: 2,
    colorSpace: "srgb",
    height: 16384,
    pageSize: 128,
    width: 16384,
  });
  const logicalPages = pageTableManifest.mipLayouts.reduce(
    (total, layout) => total + layout.width * layout.height,
    0,
  );
  const pageTable = new Uint8Array(virtualTexturePageTableByteLength(pageTableManifest));
  const pageTableSamples = [];
  let pageTableLookups = 0;
  for (let motion = 0; motion < 128; motion += 1) {
    const residents = new CountedResidents();
    const rootMip = pageTableManifest.mipCount - 1;
    residents.set(virtualTexturePageKeyParts(rootMip, 0, 0), 0);
    const originX = motion % 121;
    const originY = Math.floor(motion / 16) * 8;
    let slot = 1;
    for (let y = originY; y < originY + 8; y += 1) {
      for (let x = originX; x < originX + 8; x += 1) {
        residents.set(virtualTexturePageKeyParts(0, x, y), slot);
        slot += 1;
      }
    }
    const started = performance.now();
    writeVirtualTexturePageTable(pageTableManifest, residents, 16, pageTable);
    pageTableSamples.push(performance.now() - started);
    if (residents.gets !== logicalPages) {
      throw new Error(`VT page-table performed ${residents.gets} lookups for ${logicalPages} pages`);
    }
    pageTableLookups += residents.gets;
  }
  pageTableSamples.sort((left, right) => left - right);

  const report = {
    batchPages: 4,
    batches: samples.length,
    maxMs: samples.at(-1),
    medianMs: samples[Math.floor(samples.length * 0.5)],
    pageTableMedianMs: pageTableSamples[Math.floor(pageTableSamples.length * 0.5)],
    pageTableMotions: pageTableSamples.length,
    pageTableP95Ms: pageTableSamples[Math.floor(pageTableSamples.length * 0.95)],
    pageTableLogicalPages: logicalPages,
    pageTableLookups,
    p95Ms: samples[Math.floor(samples.length * 0.95)],
    userAgent: navigator.userAgent,
  };
  document.body.dataset.royalVtPerf = btoa(JSON.stringify(report));
</script>
</body>
